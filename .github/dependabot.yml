# Weekly dependency updates, grouped into one pull request per ecosystem.
# New versions wait 7 days before Dependabot proposes them; security updates
# do not wait.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # 0.39 and later need a newer Rust than the minimum supported 1.88.
      - dependency-name: sysinfo
        versions: [">= 0.39"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Its tag selects the Rust version, which the workflows pin on purpose.
      - dependency-name: dtolnay/rust-toolchain
