name: Release Rust

# Push a version tag, for example 0.1.0, to release that commit.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: rust-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.request.outputs.version }}
      notes: ${{ steps.request.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Validate the tag, the committed version and the changelog
        id: request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python tools/release_tag.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -Dwarnings
      - name: Verify the first publishable dependency
        run: cargo package -p crabxl-core --locked

  msrv:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --workspace --locked
      - name: Verify optional native zlib on the MSRV
        run: cargo test -p crabxl -p crabxl-xlsx --no-default-features --features deflate-zlib --locked

  publish:
    needs: [verify, msrv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Publish and verify all three crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_TOKEN }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: python tools/publish_crates.py "$RELEASE_VERSION"
      - name: Create the GitHub release after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_NOTES: ${{ needs.verify.outputs.notes }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_VERSION" > /dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" target/package/*.crate --clobber
          else
            gh release create "$RELEASE_VERSION" target/package/*.crate --verify-tag \
              --title "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
