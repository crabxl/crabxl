name: Release Rust

# A push to main whose workspace version has no tag yet releases that
# commit. The tag and the GitHub release are created after publishing.
# Run the workflow manually to resume an interrupted release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.request.outputs.release }}
      version: ${{ steps.request.outputs.version }}
      notes: ${{ steps.request.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check the committed version and its changelog section
        id: request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python tools/release_tag.py

  verify:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -Dwarnings
      - name: Verify the first publishable dependency
        run: cargo package -p crabxl-core --locked

  msrv:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - run: cargo test --workspace --locked
      - name: Verify optional native zlib on the MSRV
        run: cargo test -p crabxl -p crabxl-xlsx --no-default-features --features deflate-zlib --locked

  publish:
    needs: [version, verify, msrv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@1.120.0
      - name: Publish and verify all three crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python tools/publish_crates.py "$RELEASE_VERSION"
      - name: Create the GitHub release after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NOTES: ${{ needs.version.outputs.notes }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_VERSION" > /dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" target/package/*.crate --clobber
          else
            gh release create "$RELEASE_VERSION" target/package/*.crate --target "$GITHUB_SHA" \
              --title "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
