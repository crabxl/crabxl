[package]
name = "crabxl-benchmark-driver"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Runs one benchmark case for CrabXL or a compared library. Started by benchmarks/run.py."

# Separate workspace: the compared libraries must not enter the CrabXL workspace.
[workspace]

[[bin]]
name = "driver"
path = "src/main.rs"

[dependencies]
crabxl = { path = "../../crates/crabxl" }
calamine = "=0.36.1"
rust_xlsxwriter = { version = "=0.99.1", features = ["constant_memory"] }
umya-spreadsheet = "=3.1.0"
oxlsx = { version = "=0.2.0", default-features = false }
chrono = { version = "0.4", default-features = false }
csv = "1.3"

[profile.release]
lto = "thin"
codegen-units = 1
