[package]
name = "openrsxl-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/cmostw/openrsxl"
description = "Optional Python compatibility adapter for openrsxl"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
openrsxl = { path = "../../crates/openrsxl" }
pyo3 = { version = "0.26", features = ["extension-module"] }
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
