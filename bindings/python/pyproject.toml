[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "openrsxl"
version = "0.1.0"
requires-python = ">=3.10"
description = "Rust spreadsheet processing with an openpyxl-compatible Python surface"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8,<9", "openpyxl==3.1.5", "Pillow>=10"]

[tool.maturin]
python-source = "python"
module-name = "openrsxl._native"
