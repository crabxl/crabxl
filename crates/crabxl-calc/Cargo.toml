[package]
name = "crabxl-calc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Formula calculation for CrabXL workbooks."
[dependencies]
crabxl-core.workspace = true
formualizer-workbook = { version = "0.14", default-features = false }
formualizer-eval = { version = "0.14", default-features = false }
formualizer-parse = "4.2"
formualizer-common = "4.2"

[dev-dependencies]
# Without a version, so publishing does not wait for crabxl-xlsx, which
# depends on this crate.
crabxl-xlsx = { path = "../crabxl-xlsx", features = ["deflate-zlib-rs"] }

[lints]
workspace = true
