[package]
name = "crabxl-xlsx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bounded streaming XLSX processing for crabxl"

[features]
default = ["deflate-zlib-rs"]
deflate-zlib-rs = ["zip/deflate-flate2-zlib-rs"]
deflate-zlib = ["zip/deflate-flate2-zlib"]

[dependencies]
crabxl-core.workspace = true
zip.workspace = true
quick-xml.workspace = true
fast-float2.workspace = true
percent-encoding.workspace = true
tempfile.workspace = true
# Parallel deflate; the backend comes from the zip deflate feature.
flate2 = { version = "1.1", default-features = false }
crc32fast = "1.5"
memchr = "2.8"

# The process CPU affinity mask, which the standard library ignores on Windows.
[target.'cfg(windows)'.dependencies]
core_affinity = "0.8.3"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[lints]
workspace = true
