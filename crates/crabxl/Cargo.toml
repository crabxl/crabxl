[package]
name = "crabxl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Fast, low-memory Rust library for reading, writing and editing Excel XLSX files."
readme = "../../README.md"
keywords = ["xlsx", "excel", "spreadsheet"]
categories = ["parser-implementations", "encoding"]

[features]
default = ["deflate-zlib-rs"]
deflate-zlib-rs = ["crabxl-xlsx/deflate-zlib-rs"]
deflate-zlib = ["crabxl-xlsx/deflate-zlib"]

[dependencies]
crabxl-core.workspace = true
crabxl-xlsx.workspace = true

[lints]
workspace = true
